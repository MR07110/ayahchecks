<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyahChecks — Natijalar</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#6b4423">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <img class="logo" src="/assets/logo.png" alt="AyahChecks logotipi">
  <h1>AyahChecks</h1>
  <div class="divider">﷽</div>
  <nav class="tabs">
    <a class="tab" href="/">Jarayon</a>
    <a class="tab" href="/input">Kirish</a>
    <a class="tab active" href="/output">Natijalar</a>
  </nav>
  <p class="subtitle">Tayyor bo'lgan natijalar</p>
  <div class="history-toolbar" id="historyToolbar" hidden>
    <span id="historyInfo"></span><span id="historyCount" hidden></span>
    <span class="tb-actions"><button class="zip-btn" id="zipBtn">Hammasini yuklash (ZIP)</button>
    <button class="icon-btn danger" id="clearAllBtn" title="Barchasini o'chirish"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
  </div>
  <div id="historyList"></div>
  <div class="result" id="result">
    <div class="result-header">
      <div class="surah-name" id="surahName"></div>
      <div class="surah-info" id="surahInfo"></div>
    </div>
    <div class="report" id="report"></div>
    <div id="ayahList"></div>
    <div class="actions">
      <button id="copyBtn">Nusxalash</button>
      <button id="jsonBtn">JSON ko'rish</button>
      <button id="downloadBtn">JSON yuklab olish</button>
    </div>
    <pre class="raw-json" id="rawJson"></pre>
    <div class="meta" id="metaInfo"></div>
  </div>
  <div class="error" id="errorBox"></div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/naming.js"></script>
<script src="/js/supa.js"></script>
<script src="/js/storage.js"></script>
<script src="/js/jobs.js"></script>
<script src="/js/outbox.js"></script>
<script src="/js/run.js"></script>
<script src="/js/validate.js"></script>
<script src="/js/zip.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/output.js"></script>
</body>
</html>
